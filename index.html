  <title>Quiet Library | 도서관 집중 공부 타이머</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Serif+KR:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    :root{--ink:#f7f0e5;--gold:#cf9d59;--deep:#17120d;--serif:'Noto Serif KR',serif}*{box-sizing:border-box}body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--serif)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100svh;position:relative;overflow:hidden;background:var(--deep)}.topbar{height:82px;position:absolute;inset:0 0 auto;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,5vw,76px);border-bottom:1px solid #ffffff25}.wordmark,.topbar button{border:0;background:none;color:inherit}.wordmark{font:1.25rem 'Playfair Display',serif}.topbar nav{display:flex;gap:18px}.topbar nav button{font-size:.8rem;opacity:.88}.screen{display:none;min-height:100svh}.screen.active{display:flex}.welcome{align-items:center;justify-content:center;background:linear-gradient(90deg,#080704d7,#08070482 48%,#08070410),url('./public/images/library-study-hall.png') center/cover}.hero-copy{text-align:center;display:flex;flex-direction:column;align-items:center}.theme-picker{display:flex;padding:4px;border:1px solid #e9d1a56b;border-radius:999px;background:#160e0a82;backdrop-filter:blur(8px);margin-bottom:24px}.theme-picker button{min-width:70px;border:0;border-radius:999px;background:transparent;color:#f0e2ca;padding:8px 12px;opacity:.7}.theme-picker button.active{background:#f1d5a1;color:#3a2516;opacity:1}.enter,.primary{border:1px solid #e0bd81;background:#ead7b1;color:#292016;padding:18px 26px;font-weight:700;font-size:1rem;min-width:260px;box-shadow:0 12px 30px #0008}.enter span,.primary span{margin-left:28px}.hero-copy small{margin-top:17px;font-size:.78rem}.setup{align-items:center;flex-direction:column;text-align:center;padding:145px 24px 90px;background:radial-gradient(circle at 50% 36%,#423527 0,#221b14 40%,#12100c 75%);position:relative}.eyebrow{font:500 .76rem 'DM Mono',monospace;letter-spacing:.2em;color:var(--gold);margin:0 0 20px}.setup h1{font-size:clamp(2.8rem,5.2vw,5.5rem);line-height:1.12;letter-spacing:-.06em;font-weight:500;margin:0}.subcopy{opacity:.76;margin:20px 0 35px}.time-picker{display:flex;align-items:center;gap:23px;margin:4px 0 18px}.time-picker button{width:41px;height:41px;border:1px solid #b9a78b;background:transparent;color:#f4e8d4;font-size:1.4rem}.time-picker label{width:165px;border-bottom:1px solid #d7bd91;display:flex;align-items:baseline;justify-content:center}.time-picker input{width:100px;border:0;background:none;color:#f5e8d0;font:600 4.4rem/1 'Playfair Display',serif;text-align:center;outline:0}.time-picker span{font:.66rem 'DM Mono',monospace;color:#cdbb9e}.presets{display:flex;gap:8px;margin-bottom:31px}.presets button{border:1px solid #867b6c;color:#cdbfa8;background:transparent;padding:7px 12px}.presets .active{border-color:#e8c184;background:#e8c184;color:#21190f}.back{border:0;background:none;color:#cdbfa8;margin-top:22px}.time-books{position:absolute;right:clamp(4vw,11vw,15vw);top:52%;width:230px;height:150px;display:flex;align-items:center;justify-content:center;transform:translateY(-50%);pointer-events:none}.time-books img{width:172px;height:auto;transform-origin:center bottom;transition:transform .38s cubic-bezier(.2,.85,.35,1.15)}.focus{background:#080604 url('./public/images/focus-scene-user.png') center/cover no-repeat}.focus-head{position:absolute;top:112px;left:clamp(24px,6vw,96px);right:clamp(24px,6vw,96px);display:flex;justify-content:space-between;align-items:center;font-size:.86rem}.focus-head p{margin:0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8ecb8c;margin-right:8px;box-shadow:0 0 10px #8ecb8c}.sound-controls{display:flex;align-items:center;gap:10px}.sound{border:1px solid #ffffff4d;background:#17120d99;color:#f2e7d3;padding:8px 12px}.sound.muted{text-decoration:line-through;text-decoration-thickness:2px}.volume{display:flex;align-items:center;gap:6px;font:.72rem var(--serif);color:#e8d4b1}.volume input{width:85px;accent-color:#dcb778}.timer-wrap{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);width:min(62vw,310px);aspect-ratio:1}.ring{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke:#f5e4c833;stroke-width:1.5}.ring .progress{stroke:#e0b06e;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;transition:stroke-dashoffset .8s linear;filter:drop-shadow(0 0 4px #e0b06e)}.timer-copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.timer-copy p{font:.63rem 'DM Mono',monospace;letter-spacing:.2em;color:#dcb778}.timer-copy strong{font:500 clamp(3.3rem,9vw,5rem)/1 'Playfair Display',serif;letter-spacing:-.06em}.pause,.exit{border:1px solid #ffffff69;background:#14100ca6;color:#f5e9d7;padding:9px 14px;margin-top:20px;font-size:.78rem}.exit{display:none;margin-top:10px;border:0;background:none;text-decoration:underline}.celebration,.modal{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#1b1208e8;backdrop-filter:blur(7px)}.celebration.show,.modal.show{display:flex}.celebrate p{font:.65rem 'DM Mono',monospace;letter-spacing:.2em;color:#e7bb67}.celebrate h2{font:600 clamp(4rem,9vw,7rem)/.95 'Playfair Display',serif;margin:13px 0}.celebrate h2 span{font-family:var(--serif);font-size:.35em;color:#e7c98e}.modal article{position:relative;max-width:620px;max-height:80svh;overflow:auto;background:#f2e7d6;color:#2a2017;padding:clamp(34px,6vw,62px);text-align:left}.modal h2{font-size:2rem;margin:0 0 22px}.modal p{line-height:1.9}.close{position:absolute;right:17px;top:13px;border:0;background:none;font-size:1.8rem}footer{position:absolute;z-index:5;bottom:19px;left:clamp(22px,5vw,76px);right:clamp(22px,5vw,76px);display:flex;justify-content:space-between;font:.7rem 'DM Mono',monospace;opacity:.65}.light{--ink:#302719;--gold:#a56f2b}.light .welcome{background:url('./public/images/light-library-hero.png') center/cover}.light .topbar{background:#fff4df9c;color:#302719;border-color:#4a362533}.light .setup{background:radial-gradient(circle at 50% 36%,#fff8e9 0,#f1d7a8 45%,#c89357 100%)}.light .setup .subcopy,.light .time-picker span,.light .presets button,.light .back{color:#4a2d17;opacity:1}.light .time-picker input{color:#3d2b1b}.light .time-picker button{color:#513820;border-color:#8d704e}.light .presets button{background:#fff9edbf;border-color:#8a5f3380}.light .presets .active,.light .primary{background:#70451f;color:#fff8ed;border-color:#70451f}.light .focus{background:#f8eacb url('./public/images/bright-library-user.png') center/cover no-repeat}.light .focus-head,.light .sound,.light .volume{color:#3e2a18}.light .sound,.light .pause{background:#fff6e8d9;color:#3e2a18;border-color:#5e442c80}.light footer{color:#3e2a18;opacity:.85}@media(max-width:1000px){.time-books{position:relative;right:auto;top:auto;height:116px;margin:-3px 0 18px;transform:none}.time-books img{width:154px}}@media(max-width:620px){.topbar{height:67px;padding:0 18px}.topbar nav{gap:8px}.topbar nav button{font-size:.65rem}.wordmark{font-size:1rem}.focus-head{top:88px;left:20px;right:20px}.timer-wrap{top:43%;width:280px}.volume span{display:none}footer{left:19px;right:19px}}
    .welcome{background:linear-gradient(90deg,#080704d7,#08070482 48%,#08070410),url('./images/library-study-hall.png') center/cover}.light .welcome{background:url('./images/light-library-hero.png') center/cover}.focus{background:#080604 url('./images/focus-scene-user.png') center/cover no-repeat}.light .focus{background:#f8eacb url('./images/bright-library-user.png') center/cover no-repeat}
    .light .hero-copy small{color:#1d0d04;font-weight:700;text-shadow:0 1px 2px #fffdf4,0 2px 5px #2b1405a8}.light .topbar button{color:#302719;font-weight:600}.light footer{color:#1d0d04;font-weight:600;text-shadow:0 1px 2px #fffaf0}
    .light .setup h1,.light .time-picker input{color:#2a1608;text-shadow:0 1px 0 #fff9ed}.light .exit{color:#3e2717;font-weight:700;text-decoration-color:#3e2717;text-shadow:0 1px 0 #fff8e9}
    .light .timer-copy strong{color:#251005;text-shadow:0 1px 0 #fff8e8,0 2px 7px #fff7df}.light .timer-copy p{color:#60350f;font-weight:700}.light .exit{color:#2b1608!important;text-decoration-color:#2b1608!important}.light .volume{background:transparent;color:#fff9ee;padding:7px 9px;border:1px solid transparent;box-shadow:none;font-weight:700;text-shadow:0 1px 3px #1b0d04,0 0 7px #1b0d04}.light .volume input{accent-color:#fff1c9}
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar"><button class="wordmark" onclick="home()">✦ quiet library</button><nav><button onclick="info('건의사항','건의사항이 있을 시 <a href=mailto:seojunpark2@gmail.com>seojunpark2@gmail.com</a>으로 메일 부탁드립니다.')">건의사항</button><button onclick="info('사이트 소개','Quiet Library는 도서관의 잔잔한 분위기 속에서 공부와 독서에 몰입하도록 돕는 무료 웹 타이머입니다.')">사이트 소개</button><button onclick="info('기능 소개','원하는 시간을 설정하고, 필기소리와 함께 한 세션에 집중할 수 있습니다. 일시 정지와 완료 축하 기능도 제공합니다.')">기능 소개</button><button onclick="info('개인정보처리방침','타이머와 설정은 브라우저에서 처리하며 서버에 저장하지 않습니다. YouTube 임베드와 향후 광고 서비스는 각 서비스의 정책에 따라 데이터를 처리할 수 있습니다.')">개인정보처리방침</button></nav></header>
    <section class="screen welcome active" id="welcome"><div class="hero-copy"><div class="theme-picker"><button class="active" id="dark" onclick="theme('dark')">Dark</button><button id="light" onclick="theme('light')">Light</button></div><button class="enter" onclick="show('setup')">도서관 입장하기 <span>→</span></button><small>오늘의 집중 시간을 시작하세요</small></div></section>
    <section class="screen setup" id="setup"><p class="eyebrow">FOCUS SESSION</p><h1>오늘은 얼마 동안<br>공부할까요?</h1><p class="subcopy">나에게 꼭 맞는 집중 시간을 정해보세요.</p><div class="time-picker"><button onclick="adjust(-1)">−</button><label><input id="minutes" type="number" min="1" max="180" value="25" oninput="setMinutes(this.value)"><span>minutes</span></label><button onclick="adjust(1)">+</button></div><div class="presets"><button onclick="setMinutes(30)">30분</button><button onclick="setMinutes(60)">60분</button><button onclick="setMinutes(90)">90분</button></div><div class="time-books"><img id="books" src="./public/images/timer-book-stack-cutout.png" alt="집중 시간에 따라 크기가 변하는 책 더미"></div><button class="primary" onclick="start()">집중 시작하기 <span>→</span></button><button class="back" onclick="show('welcome')">← 입구로 돌아가기</button></section>
    <section class="screen focus" id="focus"><iframe id="youtube" title="필기소리" src="https://www.youtube.com/embed/wIBnaNuhuCQ?enablejsapi=1&playsinline=1&rel=0" allow="autoplay;encrypted-media" style="display:none"></iframe><div class="focus-head"><p><span class="dot"></span>집중 중</p><div class="sound-controls"><button class="sound" id="sound" onclick="toggleSound()">필기소리</button><label class="volume"><span id="volumeLabel">음량 50%</span><input type="range" min="0" max="100" value="50" oninput="volume(this.value)"></label></div></div><div class="timer-wrap"><svg class="ring" viewBox="0 0 240 240"><circle cx="120" cy="120" r="104"></circle><circle class="progress" id="progress" cx="120" cy="120" r="104" pathLength="1"></circle></svg><div class="timer-copy"><p id="state">FOCUS TIME</p><strong id="clock">25:00</strong><button class="pause" id="pause" onclick="pause()">Ⅱ 일시 정지</button><button class="exit" id="exit" onclick="home()">⌂ 메인 화면으로</button></div></div></section>
    <footer><span>© 2026 quiet library</span><span>나만의 속도로, 꾸준히.</span></footer>
  </main>
  <div class="celebration" id="celebration"><div class="celebrate"><p>SESSION COMPLETE</p><h2>Celebrate!<br><span>오늘도 해냈어요.</span></h2><p id="message"></p><button class="primary" onclick="show('setup')">새 세션 준비하기</button></div></div>
  <div class="modal" id="modal"><article><button class="close" onclick="closeInfo()">×</button><h2 id="modalTitle"></h2><p id="modalText"></p></article></div>
  <script>
    let minutes=25,seconds=1500,total=1500,paused=false,muted=false,timer;const $=id=>document.getElementById(id);
    function click(){const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(540,c.currentTime);o.frequency.exponentialRampToValueAtTime(380,c.currentTime+.055);g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.065);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.07)}document.addEventListener('click',e=>{if(e.target.closest('button'))click()});
    function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id!=='focus')stopSound();$('celebration').classList.remove('show')}
    function theme(t){$('app').classList.toggle('light',t==='light');$('dark').classList.toggle('active',t==='dark');$('light').classList.toggle('active',t==='light')}
    function setMinutes(v){minutes=Math.max(1,Math.min(180,Number(v)||1));$('minutes').value=minutes;seconds=minutes*60;total=seconds;$('clock').textContent=format(seconds);$('books').style.transform=`scale(${Math.max(.85,Math.min(2.2,.85+((minutes-1)/179)*1.35))})`;document.querySelectorAll('.presets button').forEach(b=>b.classList.toggle('active',b.textContent===minutes+'분'))}
    function adjust(d){setMinutes(d===1?(minutes<5?5:minutes+5):(minutes<=5?1:minutes-5))}function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
    function start(){seconds=minutes*60;total=seconds;paused=false;show('focus');$('pause').textContent='Ⅱ 일시 정지';$('exit').style.display='none';render();playSound();clearInterval(timer);timer=setInterval(()=>{if(!paused&&seconds>0){seconds--;render();if(!seconds)complete()}},1000)}
    function render(){$('clock').textContent=format(seconds);$('progress').style.strokeDashoffset=1-seconds/total}function pause(){paused=!paused;$('state').textContent=paused?'잠시 쉬는 중':'FOCUS TIME';$('pause').textContent=paused?'▶ 다시 시작':'Ⅱ 일시 정지';$('exit').style.display=paused?'block':'none';paused?send('pauseVideo'):playSound()}
    function complete(){clearInterval(timer);stopSound();$('message').innerHTML=minutes+'분의 집중이 차곡차곡<br>당신의 내일을 만들어가고 있어요.';$('celebration').classList.add('show')}
    function send(func,args=[]){$('youtube').contentWindow?.postMessage(JSON.stringify({event:'command',func,args}),'*')}function playSound(){send('setVolume',[Number(document.querySelector('.volume input').value)]);send(muted?'mute':'unMute');send('playVideo')}function stopSound(){send('stopVideo')}function toggleSound(){muted=!muted;$('sound').classList.toggle('muted',muted);playSound()}function volume(v){$('volumeLabel').textContent='음량 '+v+'%';send('setVolume',[Number(v)])}function home(){clearInterval(timer);stopSound();show('welcome')}function info(title,text){$('modalTitle').textContent=title;$('modalText').innerHTML=text;$('modal').classList.add('show')}function closeInfo(){$('modal').classList.remove('show')}setMinutes(25);
  </script>
  <script>document.getElementById('books').src='./images/timer-book-stack-cutout.png';</script>
  <script>let youtubeStarted=false;const originalPlaySound=playSound;playSound=()=>{if(!youtubeStarted){youtubeStarted=true;$('youtube').src='https://www.youtube.com/embed/wIBnaNuhuCQ?enablejsapi=1&autoplay=1&playsinline=1&rel=0';setTimeout(originalPlaySound,700)}else{originalPlaySound()}};</script>
  <script>const player=$('youtube');player.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';player.addEventListener('load',()=>{if(youtubeStarted)originalPlaySound()});</script>
</body>
</html>
